<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body { font-family:"Segoe UI"; margin:0; padding:0; background:#f0f0f0; }
.container { max-width:900px; margin:50px auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
h2 { text-align:center; margin-bottom:30px; }
table { width:100%; border-collapse:collapse; }
th, td { padding:12px; border-bottom:1px solid #ddd; text-align:center; }
button { padding:8px 15px; border:none; border-radius:6px; cursor:pointer; transition:0.3s; }
.approve { background:green; color:white; }
.reject { background:red; color:white; }
button:hover { opacity:0.8; }
</style>
</head>
<body>

<div class="container">
  <h2>Admin Panel - Approve / Reject Investments</h2>
  <table>
    <thead>
      <tr>
        <th>User ID</th>
        <th>Plan</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="investmentTable"></tbody>
  </table>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { collection, getDocs, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

// তুমি যেই UID দিয়েছো সেটা admin
const ADMIN_UID = "CJnhXotCpzbauGdfmlSufTKGGPw2";

// Auth check
onAuthStateChanged(auth, async (user) => {
  if(!user){
    // কেউ লগইন না করলে login page-এ পাঠাও
    window.location.href = "login.html";
    return;
  }

  if(user.uid !== ADMIN_UID){
    alert("আপনার অ্যাক্সেস নেই!");
    window.location.href = "dashboard.html"; // অন্যরা এখানে যাবে
    return;
  }

  // Admin হলে pending investments লোড করো
  loadInvestments();
});

async function loadInvestments(){
  const table = document.getElementById('investmentTable');
  table.innerHTML = "";
  const q = query(collection(db, "investments"), where("status", "==", "pending"));
  const querySnapshot = await getDocs(q);

  querySnapshot.forEach(docSnap => {
    const data = docSnap.data();
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${data.userId}</td>
      <td>${data.plan}</td>
      <td>${data.amount}</td>
      <td>${data.status}</td>
      <td>
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </td>
    `;
    table.appendChild(row);

    // Approve button
    row.querySelector(".approve").addEventListener("click", async () => {
      await updateDoc(doc(db, "investments", docSnap.id), {status: "approved"});
      row.remove();
    });

    // Reject button
    row.querySelector(".reject").addEventListener("click", async () => {
      await updateDoc(doc(db, "investments", docSnap.id), {status: "rejected"});
      row.remove();
    });
  });
}
</script>

</body>
</html>
