<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body { font-family:"Segoe UI"; background:#f0f2f5; margin:0; padding:20px; }
header { background:#111; color:white; padding:15px; text-align:center; border-radius:10px; margin-bottom:20px; }
.container { max-width:1000px; margin:auto; }
.card { background:white; padding:15px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-bottom:15px; }
button { padding:5px 12px; margin:3px; border:none; border-radius:8px; cursor:pointer; transition:0.3s; }
.approve { background:#28a745; color:white; }
.approve:hover { background:#1e7e34; }
.reject { background:#dc3545; color:white; }
.reject:hover { background:#a71d2a; }
.logout { padding:8px 15px; border:none; border-radius:8px; cursor:pointer; background:#ff6ec7; color:white; float:right; }
</style>
</head>
<body>

<header>
  <h2>🛠 Admin Panel</h2>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container" id="adminContent">
  Loading payment requests...
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { collection, doc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const adminContent = document.getElementById("adminContent");

// Logout function
function logout(){
  signOut(auth).then(()=>window.location.href="login.html");
}

// Update payment status
window.updateStatus = async function(docId, status){
  try{
    const docRef = doc(db, "paymentRequests", docId);
    await updateDoc(docRef, { status: status });
    alert(`✅ Status updated to ${status}`);
  } catch(e){
    alert("❌ Error: " + e.message);
  }
}

// Load payment requests realtime
function loadPaymentRequestsRealtime(){
  const qPayments = collection(db, "paymentRequests");
  onSnapshot(qPayments, (snapshot) => {
    adminContent.innerHTML = "";
    if(snapshot.empty){
      adminContent.innerHTML = "<p>কোনো payment request নেই।</p>";
      return;
    }

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const id = docSnap.id;
      adminContent.innerHTML += `
        <div class="card">
          <b>${data.plan}</b><br>
          UID: ${data.uid}<br>
          Amount: ${data.amount} ৳<br>
          Status: <b>${data.status}</b><br>
          Screenshot: ${data.screenshot ? `<a href="${data.screenshot}" target="_blank">View</a>` : "No screenshot"}<br>
          <button class="approve" onclick="updateStatus('${id}','approved')">Approve</button>
          <button class="reject" onclick="updateStatus('${id}','rejected')">Reject</button>
        </div>
      `;
    });
  });
}

// Admin verification using Firestore collection
onAuthStateChanged(auth, async (user) => {
  if(!user) return window.location.href="login.html";

  try{
    const adminDoc = await getDoc(doc(db, "admins", user.uid));
    if(!adminDoc.exists()){
      alert("Unauthorized — আপনি অ্যাডমিন নন");
      return window.location.href="dashboard.html";
    }

    // Admin confirmed → Load requests realtime
    loadPaymentRequestsRealtime();
  } catch(e){
    alert("❌ Error checking admin: " + e.message);
    return window.location.href="dashboard.html";
  }
});
</script>
</body>
</html>
