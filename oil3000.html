<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oil Plan 3 - 3000 টাকা</title>
  <style>
    body { font-family:"Segoe UI"; background:#f0f2f5; margin:0; padding:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .container { background: rgba(255,255,255,0.95); padding:30px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.2); width:95%; max-width:500px; text-align:center; }
    h2 { margin-bottom:15px; color:#222; }
    p { color:#444; font-size:16px; }
    .number-box { background:#111; color:white; padding:12px; border-radius:10px; margin:15px 0; font-weight:600; }
    input[type="file"] { margin:15px 0; padding:10px; border:2px dashed #6a11cb; border-radius:10px; width:100%; cursor:pointer; background:#fafafa; }
    button { padding:12px 25px; border:none; border-radius:10px; background:linear-gradient(135deg,#6a11cb,#ff6ec7); color:white; font-size:16px; cursor:pointer; transition:0.3s; margin-top:10px; }
    button:hover { transform: scale(1.05); background: linear-gradient(135deg,#ff9a00,#ff6ec7); }
    .back-btn { background:#111; margin-top:20px; }
    .back-btn:hover { background:#ff6ec7; }
    .success-message { font-weight:600; margin-top:15px; border-radius:10px; padding:12px; color:white; background:blue; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📦 Plan 3: 3000 টাকা</h2>
    <p>আপনি এই প্ল্যানটি নিতে চাইলে নিচের নাম্বারে টাকা Send Money করুন।</p>

    <div class="number-box">
      📲 01404917825 <br> বিকাশ / নগদ / রকেট
    </div>

    <p>💳 টাকা পাঠানোর পর স্ক্রিনশট আপলোড করুন</p>
    <input type="file" id="screenshot">

    <button onclick="submitPayment()">✅ Submit</button>
    <br>
    <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back</button>

    <!-- Success message এখানে dynamically add হবে -->
    <div id="messageContainer"></div>
  </div>

<script type="module">
  import { auth, db, storage } from './firebase.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";

  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
    if(user) currentUser = user;
    else window.location.href = "login.html";
  });

  window.submitPayment = async function(){
    const fileInput = document.getElementById("screenshot");
    if(!fileInput.files[0]) return alert("❌ স্ক্রিনশট আপলোড করুন");
    if(!currentUser) return alert("Please login first");

    try {
      // Upload screenshot to Firebase Storage
      const fileRef = ref(storage, `payments/${currentUser.uid}/${Date.now()}.jpg`);
      await uploadBytes(fileRef, fileInput.files[0]);
      const fileURL = await getDownloadURL(fileRef);

      // Add payment request to Firestore
      await addDoc(collection(db, "paymentRequests"), {
        uid: currentUser.uid,
        plan: "Oil Plan 3 - 3000 টাকা",
        amount: 3000,
        dailyProfit: 150,
        totalProfit: 0,
        lastProfitUpdate: new Date().toDateString(),
        screenshot: fileURL,
        status: "pending",
        createdAt: serverTimestamp()
      });

      // Success message
      const messageDiv = document.createElement("div");
      messageDiv.className = "success-message";
      messageDiv.innerText = "✅ Success! আপনার প্যাকেজটি কিছুক্ষণের ভিতরে অ্যাড হয়ে যাবে।";
      document.getElementById("messageContainer").appendChild(messageDiv);

      // 20 সেকেন্ড পরে remove
      setTimeout(() => messageDiv.remove(), 20000);

      // Optional: redirect after 3-5 sec
      // setTimeout(() => window.location.href = "dashboard.html", 5000);

    } catch(e){
      alert("❌ Error: " + e.message);
    }
  }
</script>
</body>
</html>
