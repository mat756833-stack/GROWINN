<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Package</title>
  <style>
    body{font-family:"Segoe UI";background:#f9f9f9;padding:20px;}
    .box{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
    .pending{background:#e0f0ff; color:#111; font-weight:600;}
    .rejected{background:#ffe0e0; color:#111; font-weight:600;}
  </style>
</head>
<body>
  <h2>📦 My Package</h2>
  <div id="packageBox">Loading...</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const packageBox = document.getElementById("packageBox");

onAuthStateChanged(auth, (user)=>{
  if(!user){ window.location.href="login.html"; return; }

  const q = query(collection(db, "paymentRequests"), where("uid","==",user.uid));

  onSnapshot(q, async (snapshot)=>{
    packageBox.innerHTML = "";
    if(snapshot.empty){
      packageBox.innerHTML = "❌ আপনার কোনো active package নেই 
        
              প্যাকেজ ক্রয় করুন ।";
      return;
    }

    snapshot.forEach(async (d)=>{
      const data = d.data();
      let boxClass = "box";
      let statusHTML = "";

      if(data.status === "pending"){
        boxClass += " pending";
        statusHTML = "⏳ Processing... আপনার প্যাকেজ কিছুক্ষণের মধ্যে অ্যাড হবে";
      } else if(data.status === "approved"){
        const today = new Date().toDateString();
        if(data.lastProfitUpdate !== today){
          const newTotal = (data.totalProfit || 0) + (data.dailyProfit || 0);
          await updateDoc(doc(db,"paymentRequests",d.id),{
            totalProfit: newTotal,
            lastProfitUpdate: today
          });
          data.totalProfit = newTotal;
          data.lastProfitUpdate = today;
        }
        statusHTML = `
          📅 সর্বশেষ আপডেট: ${data.lastProfitUpdate}<br>
          💰 দৈনিক প্রফিট: ${data.dailyProfit} ৳<br>
          🧮 মোট প্রফিট: ${data.totalProfit} ৳
        `;
      } else if(data.status === "rejected"){
        boxClass += " rejected";
        statusHTML = "❌ Rejected / Pending";
      }

      packageBox.innerHTML += `
        <div class="${boxClass}">
          <b>${data.plan}</b><br>
          ${statusHTML}
        </div>
      `;
    });
  });
});
</script>
</body>
</html>
